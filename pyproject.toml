[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openshift-mcp-server"
version = "0.1.0"
description = "MCP server exposing OpenShift/Kubernetes cluster operations as tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mukesh Kumar Samuthiraraj" }]
keywords = ["mcp", "openshift", "kubernetes", "model-context-protocol"]
dependencies = [
    "mcp>=2.1",
    "kubernetes>=31",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
openshift-mcp-server = "openshift_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openshift_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastMCP uses call-in-default-arg patterns

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
