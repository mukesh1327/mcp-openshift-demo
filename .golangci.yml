version: "2"

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - revive
    - unconvert
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # package doc comments are enforced separately; avoid duplicate noise

formatters:
  enable:
    - gofmt
    - goimports
