# Optional, pairs with clusterrole-projects.yaml — apply both together, or
# neither.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-openshift-server-projects
subjects:
  - kind: ServiceAccount
    name: mcp-openshift-server
    namespace: mcp-openshift-server
roleRef:
  kind: ClusterRole
  name: mcp-openshift-server-projects
  apiGroup: rbac.authorization.k8s.io
