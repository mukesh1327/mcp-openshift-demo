# Optional, pairs with clusterrole-projects.yaml — apply both together, or
# neither.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-mcp-server-projects
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server
    namespace: openshift-mcp-server
roleRef:
  kind: ClusterRole
  name: openshift-mcp-server-projects
  apiGroup: rbac.authorization.k8s.io
