# The server exposes GENERIC resource tools (resources_list/get/apply/scale/
# delete work on any kind), so RBAC - not a hand-picked verb list - is the
# access boundary. This Role is deliberately broad on reads and scoped on
# writes. Tighten it, and scope the RoleBinding to only the namespaces the
# server should touch. `--read-only` / `--disable-destructive` further limit
# what the server will even attempt.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshift-mcp-server
  namespace: openshift-mcp-server
rules:
  # Read anything in the bound namespace(s).
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Writes used by resources_apply / resources_scale / workloads_restart.
  # Remove this rule to make the deployment effectively read-only at the
  # RBAC layer regardless of flags.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["create", "update", "patch"]

  # OpenShift build trigger (builds_trigger -> buildconfigs/instantiate).
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiate"]
    verbs: ["create"]

  # Add only if you run with --no-disable-destructive (resources_delete):
  # - apiGroups: ["*"]
  #   resources: ["*"]
  #   verbs: ["delete"]
