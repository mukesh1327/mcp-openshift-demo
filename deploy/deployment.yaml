apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-mcp-server
  namespace: openshift-mcp-server
  labels:
    app: openshift-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-mcp-server
  template:
    metadata:
      labels:
        app: openshift-mcp-server
    spec:
      serviceAccountName: openshift-mcp-server
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openshift-mcp-server
          image: openshift-mcp-server:latest # replace with your built/pushed image
          args: ["--transport", "http", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: MCP_LOG_LEVEL
              value: INFO
            # Restrict this deployment to read-only tools:
            # - name: MCP_READ_ONLY
            #   value: "true"
            # Target external clusters instead of the pod's own ServiceAccount:
            # mount a kubeconfig Secret and point KUBECONFIG at it. Each context
            # in it becomes selectable via the `context` tool argument.
            # - name: KUBECONFIG
            #   value: /etc/mcp/kubeconfig
          ports:
            - name: http
              containerPort: 8080
          # volumeMounts:
          #   - name: kubeconfig
          #     mountPath: /etc/mcp
          #     readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
      # volumes:
      #   - name: kubeconfig
      #     secret:
      #       secretName: openshift-mcp-kubeconfig
